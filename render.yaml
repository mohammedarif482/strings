services:
  - type: web
    name: strings-api
    env: python
    region: singapore
    plan: free
    rootDir: services/api-backend
    buildCommand: pip install -r requirements.txt
    startCommand: uvicorn src.main:app --host 0.0.0.0 --port $PORT
    envVars:
      - key: PYTHON_VERSION
        value: 3.11.0
